
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)" opacity="0.1"/>
  
  <!-- Main Genie Lamp -->
  <path d="M70 140 Q50 130 45 110 Q40 90 55 80 L75 75 Q85 70 95 75 L140 85 Q150 90 145 105 Q140 120 125 130 L100 140 Q85 145 70 140 Z" 
        fill="url(#grad1)" 
        filter="url(#glow)"/>
  
  <!-- Lamp Spout -->
  <path d="M140 85 Q160 80 170 70 Q175 65 170 60 Q165 55 155 60 Q145 65 140 75" 
        fill="url(#grad1)" 
        opacity="0.8"/>
  
  <!-- Genie Smoke -->
  <path d="M170 60 Q180 50 175 40 Q170 30 180 25 Q190 20 185 10 Q180 5 190 0 Q200 -5 195 -10" 
        stroke="url(#grad2)" 
        stroke-width="3" 
        fill="none" 
        opacity="0.7"/>
  
  <!-- Magic Sparkles -->
  <g fill="url(#grad2)" opacity="0.8">
    <circle cx="160" cy="45" r="2"/>
    <circle cx="175" cy="35" r="1.5"/>
    <circle cx="185" cy="25" r="2"/>
    <circle cx="170" cy="15" r="1"/>
    <circle cx="190" cy="40" r="1.5"/>
  </g>
  
  <!-- Lamp Handle -->
  <path d="M50 115 Q35 115 30 105 Q25 95 35 90 Q45 85 50 95 L55 105" 
        fill="url(#grad1)" 
        opacity="0.9"/>
  
  <!-- Tech Circuit Pattern -->
  <g stroke="url(#grad1)" stroke-width="1.5" fill="none" opacity="0.3">
    <path d="M80 160 L90 160 L90 170 L100 170"/>
    <path d="M110 160 L120 160 L120 150 L130 150"/>
    <path d="M85 175 L95 175 L95 185"/>
    <circle cx="95" cy="165" r="2"/>
    <circle cx="115" cy="155" r="2"/>
    <circle cx="90" cy="180" r="1.5"/>
  </g>
  
  <!-- Gadget Icons -->
  <g fill="white" opacity="0.8">
    <!-- Smartphone -->
    <rect x="75" y="100" width="8" height="12" rx="2"/>
    <rect x="76" y="101" width="6" height="8" fill="url(#grad1)" opacity="0.5"/>
    
    <!-- Headphones -->
    <path d="M100 95 Q105 90 110 95 Q115 100 110 105 Q105 110 100 105 Q95 100 100 95"/>
    <circle cx="98" cy="100" r="2"/>
    <circle cx="112" cy="100" r="2"/>
  </g>
  
  <!-- Company Name -->
  <text x="100" y="190" text-anchor="middle" fill="url(#grad1)" font-family="Arial, sans-serif" font-weight="bold" font-size="14">
    GADGET GENIE
  </text>
</svg>
